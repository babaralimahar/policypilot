# Local stack:  docker compose up -d        (db + jaeger + migrate + api)
#               docker compose up -d db     (just Postgres, for tests)
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres  # local only; real credentials live in the host's env vars
      POSTGRES_DB: app
    ports: ["127.0.0.1:${DB_PORT:-5435}:5432"]  # 5435: the template stack uses 5433
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16688}:16686"  # UI: http://127.0.0.1:16688
      - "127.0.0.1:${OTLP_PORT:-4320}:4318"         # OTLP/HTTP

  migrate:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m policypilot.cli ingest"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/app
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    ports: ["127.0.0.1:${API_PORT:-8004}:8000"]  # http://127.0.0.1:8004/docs
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/app
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-set-me}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OTEL_ENDPOINT: http://jaeger:4318/v1/traces
      WORKER_MODE: "off"
      EMBED_PROVIDER: ${EMBED_PROVIDER:-fake}
      UPLOAD_RATE_PER_MINUTE: ${UPLOAD_RATE_PER_MINUTE:-30}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      jaeger: { condition: service_started }

volumes:
  pgdata:
